name: 构建多平台安装包

# 手动触发（Actions 页面 Run workflow）或打 v* 标签时触发
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# CI 运行器在美国机房：用 PyPI 官方源（比国内镜像更快更稳）；
# 本地构建不带此变量则默认阿里云镜像。
env:
  JUPITER_PYPI_MIRROR: https://pypi.org/simple

jobs:
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin
      - name: 缓存出厂环境快照（依赖锁未变时跳过重建，省 ~6 分钟）
        id: snapshot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src-tauri/resources/env-factory.tar.zst
          key: factory-snapshot-macos-arm64-v1-${{ hashFiles('runtime/requirements-macos-arm64.lock.txt', 'runtime/build-snapshot.sh', 'runtime/sitecustomize.py') }}
      - name: 构建出厂环境快照（Python 3.9.7 + 锁定依赖）
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: ./runtime/build-snapshot.sh macos-arm64
      - name: 构建应用（仅 .app）
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles app
      - name: 制作带中文安装指引的 DMG
        run: ./runtime/make-dmg.sh "app/src-tauri/target/release/bundle/macos/朱比特和它的朋友们.app" "dist/JupyterBento_@VERSION@_macOS-AppleSilicon.dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macOS-AppleSilicon-DMG
          path: dist/*.dmg

  macos-x64:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: 1.88.0
          targets: x86_64-apple-darwin
      - name: 缓存出厂环境快照（依赖锁未变时跳过重建，省 ~6 分钟）
        id: snapshot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src-tauri/resources/env-factory.tar.zst
          key: factory-snapshot-macos-x64-v1-${{ hashFiles('runtime/requirements-macos-x64.lock.txt', 'runtime/build-snapshot.sh', 'runtime/sitecustomize.py') }}
      - name: 构建出厂环境快照（Python 3.9.7 + 锁定依赖）
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: ./runtime/build-snapshot.sh macos-x64
      - name: 构建应用（仅 .app）
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles app --target x86_64-apple-darwin
      - name: 制作带中文安装指引的 DMG
        run: ./runtime/make-dmg.sh "app/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/朱比特和它的朋友们.app" "dist/JupyterBento_@VERSION@_macOS-Intel.dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macOS-Intel-DMG
          path: dist/*.dmg

  windows-x64:
    name: Windows 10 x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc
      - name: 缓存出厂环境快照（依赖锁未变时跳过重建，省 ~6 分钟）
        id: snapshot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src-tauri/resources/env-factory.tar.zst
          key: factory-snapshot-win-x64-v1-${{ hashFiles('runtime/requirements-win-x64.lock.txt', 'runtime/build-snapshot.ps1', 'runtime/sitecustomize.py') }}
      - name: 构建出厂环境快照（Python 3.9.7 + 原始锁定依赖）
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./runtime/build-snapshot.ps1 -Target win-x64
      - name: 构建应用与 NSIS 安装包
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - name: 规范产物文件名（英文全名，避免中文名在浏览器下载时被剥离）
        shell: pwsh
        run: |
          $ver = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            Copy-Item $_.FullName "dist/JupyterBento_${ver}_x64-setup.exe"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-x64-NSIS-Setup
          path: dist/*.exe

  # 打 v* 标签推送时：自动创建 GitHub Release 并附上三平台安装包 + SHA256 校验文件
  release:
    name: 创建 GitHub Release
    needs: [macos-arm64, macos-x64, windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --generate-notes 需要 git 仓库上下文，必须先 checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 下载全部构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          merge-multiple: true

      - name: 生成 SHA256 校验文件
        run: |
          shopt -s nullglob
          for f in *.dmg *.exe; do
            shasum -a 256 "$f" >> SHA256SUMS.txt
          done
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: 创建 Release 并上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          # 预发布标签（v1.0.1-alpha.1 / -beta / -rc 等含 "-" 的标签）自动标记为 Pre-release
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$TAG" $PRERELEASE_FLAG \
            --title "朱比特和它的朋友们 $VER" \
            --generate-notes \
            *.dmg *.exe SHA256SUMS.txt

[package]
name = "jupiter"
version = "1.1.0"
description = "朱比特和它的朋友们 - 开箱即用的 Jupyter Notebook 桌面版"
edition = "2021"
rust-version = "1.77"

[lib]
name = "jupiter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
zstd = "0.13"
rand = "0.8"
urlencoding = "2"
sha2 = "0.10"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"
